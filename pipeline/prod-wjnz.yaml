kind: kubebot.values/v1
deployment:
  image: imagename
  livenessProbe: /
  readinessProbe: /
  env:
    - name: ENVIRONMENT
      value: prod
    - name: SITE
      value: wjnz
    - name: INDEX_HTML
      value: index.prod-wjnz.html
    - name: APP_PATH
      value: /html

configmap:
  path: /html/config/
  files:
    config.js: |
      const WEBAPP_CONFIG = {
        homeUrl: 'https://www.webjet.co.nz'
      }

ingress:
  ssi: on
  rewrite-target: /
  rules:
    - hostname: services.webjet.co.nz
      path: /web/[product]/[service]
