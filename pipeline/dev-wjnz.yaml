kind: kubebot.values/v1
deployment:
  image: imagename
  livenessProbe: /
  readinessProbe: /
  replicas: 1
  env:
    - name: ENVIRONMENT
      value: dev
    - name: SITE
      value: wjnz
    - name: INDEX_HTML
      value: index.dev-wjnz.html
    - name: APP_PATH
      value: /html

configmap:
  path: /html/config/
  files:
    config.js: |
      const WEBAPP_CONFIG = {
        homeUrl: 'https://scms.webjet.co.nz'
      }

ingress:
  ssi: on
  rewrite-target: /
  rules:
    - hostname: services.dev.webjet.co.nz
      path: /web/[product]/[service]